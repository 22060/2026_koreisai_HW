<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Motion Viewer</title>
    <style>
        body {
            margin: 0;
            background: #111;
            color: #fff;
            font-family: sans-serif
        }

        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #0008;
            padding: 10px;
            border-radius: 8px
        }

        input {
            width: 260px
        }
    </style>
</head>

<body>
    <div id="ui">
        <div>WS:<input id="wsurl" value="wss://koreisai-game.ryutolab.com/ws"></div>
        <button onclick="connect()">Connect</button>
        <button onclick="enableMotion()">Enable Motion</button>
        <button onclick="calibrate()">Calibrate</button>
        <div id="status">Disconnected</div>
        <pre id="q">w=1
x=0
y=0
z=0</pre>
    </div>
    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.166.1/build/three.module.js';
        let  offset = new THREE.Quaternion(), q = new THREE.Quaternion();
        const scene = new THREE.Scene(); const cam = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, .1, 100); cam.position.z = 3;
        const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(innerWidth, innerHeight); document.body.appendChild(r.domElement);
        const cube = new THREE.Mesh(new THREE.BoxGeometry(), new THREE.MeshNormalMaterial()); scene.add(cube);
        addEventListener('resize', () => { cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); r.setSize(innerWidth, innerHeight); });
        let ws = new WebSocket("wss://koreisai-game.ryutolab.com/ws");

        function e2q(a, b, g) {
            const e = new THREE.Euler(THREE.MathUtils.degToRad(b), THREE.MathUtils.degToRad(a), -THREE.MathUtils.degToRad(g), 'YXZ'); q.setFromEuler(e); q.premultiply(offset); cube.quaternion.copy(q);
            qel.textContent = `w=${q.w.toFixed(4)}
            x=${q.x.toFixed(4)}
            y=${q.y.toFixed(4)}
            z=${q.z.toFixed(4)}`;
            if (ws && ws.readyState === 1){
                let data = {
                    id:"controller_002",
                    quat : {
                        w: q.w,
                        x: q.x,
                        y: q.y,
                        z: q.z
                    },
                    accuracy: 0.1
                }
                ws.send(JSON.stringify(data));
            }
        }
        
        window.connect = () => {
            ws = new WebSocket(wsurl.value);
            ws.onopen = () => console.log("OPEN");
            ws.onclose = (e) => console.log("CLOSE", e);
            ws.onerror = (e) => console.log("ERROR", e);
            ws.onmessage = (e) => console.log(e.data);
        }
        
        window.calibrate = () => offset.copy(q.clone().invert());
        window.enableMotion = async () => {
            if (typeof DeviceOrientationEvent.requestPermission === "function") { if (await DeviceOrientationEvent.requestPermission() !== "granted") return; }
            addEventListener("deviceorientation", e => e2q(e.alpha || 0, e.beta || 0, e.gamma || 0));
        };
        function anim() { requestAnimationFrame(anim); r.render(scene, cam); } anim();
        const qel = document.getElementById('q');
    </script>
</body>

</html>
