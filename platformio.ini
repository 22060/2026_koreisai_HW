[env:gyro_test]
platform = espressif32
board = esp32dev
framework = arduino
build_flags = 
	-D GYRO_TEST
lib_deps = 
	adafruit/Adafruit BNO08x@^1.2.5
	links2004/WebSockets@^2.7.3
