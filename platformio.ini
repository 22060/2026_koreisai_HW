[platformio]
default_envs = unity_controller

[env]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
upload_protocol = esptool
extra_scripts = pre:scripts/wifi_env.py

; Original sensor experiments remain available.
[env:gyro_test]
build_flags =
    -D GYRO_TEST
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    adafruit/Adafruit BNO08x@^1.2.5
    links2004/WebSockets@^2.7.3

[env:gyro_test2]
build_flags =
    -D GYRO_TEST2
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
monitor_speed = 115200
lib_deps =
    electroniccats/MPU6050
    arduino-libraries/Madgwick
    links2004/WebSockets

[unity_base]
monitor_speed = 115200
build_src_filter = -<*> +<unity_controller.cpp>
lib_deps =
    adafruit/Adafruit BNO08x@^1.2.5
    adafruit/Adafruit BNO055@^1.6.4
    makuna/NeoPixelBus@^2.8.4
build_flags =
    -D UNITY_CONTROLLER
    -D KJ_GROUP=0
    -D KJ_UDP_PORT=42042

; One production firmware for every PC and player.
[env:unity_controller]
extends = unity_base
build_flags =
    ${unity_base.build_flags}
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
